<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamPrep Pro</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#687386;--primary:#315efb;--soft:#eaf0ff;--border:#e4e8f0;--good:#16835b;--danger:#d14b55}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh}.top{background:#fff;border-bottom:1px solid var(--border);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:21px}.brand span{color:var(--primary)}.pill{font-size:12px;background:var(--soft);color:var(--primary);padding:6px 10px;border-radius:99px;font-weight:700}.wrap{max-width:1080px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#315efb,#6b5dfb);color:white;border-radius:24px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:19px;box-shadow:0 4px 18px #15234a0b}.click{cursor:pointer;transition:.18s}.click:hover{transform:translateY(-2px);box-shadow:0 8px 24px #15234a12}.icon{font-size:28px}.title{font-weight:800;margin:9px 0 5px}.muted{color:var(--muted);font-size:14px}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--primary);color:white}.btn.secondary{background:#eef1f7;color:var(--ink)}.btn.danger{background:#fff0f1;color:var(--danger)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.back{margin-bottom:15px;color:var(--primary);cursor:pointer;font-weight:700}.crumb{color:var(--muted);font-size:13px;margin-bottom:8px}.tabs{display:flex;gap:7px;background:#edf0f6;padding:6px;border-radius:14px;margin:20px 0}.tab{flex:1;border:0;padding:11px;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;color:var(--muted)}.tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px #0000000c}.list{display:grid;gap:10px}.item{padding:15px;border:1px solid var(--border);border-radius:14px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:11px;padding:5px 8px;border-radius:7px;background:#eef7f2;color:var(--good);font-weight:800}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--border);padding:30px;border-radius:24px;box-shadow:0 12px 45px #14204d12}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;outline:none}.field input:focus{border-color:var(--primary)}.adminnav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.adminnav button{white-space:nowrap}.stat{font-size:27px;font-weight:850}.empty{text-align:center;padding:35px;color:var(--muted)}.modal{position:fixed;inset:0;background:#10182799;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{background:white;border-radius:20px;padding:22px;width:min(520px,100%)}.hidden{display:none!important}@media(max-width:600px){.hero h1{font-size:25px}.top{padding:13px 16px}.wrap{padding:20px 14px}.tabs{position:sticky;top:63px;z-index:3}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script>
const API='/api';
let state={screen:'login',role:null,token:localStorage.getItem('examprep_token'),user:null,courses:[],course:null,sem:null,subject:null,tab:'questions',adminTab:'dashboard',items:[],stats:null};
const api=async(path,opts={})=>{opts.headers={...(opts.headers||{}), 'Content-Type':'application/json'}; if(state.token) opts.headers.Authorization='Bearer '+state.token; const r=await fetch(API+path,opts); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Request failed'); return d};
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function init(){if(state.token){try{const d=JSON.parse(localStorage.getItem('examprep_user')||'null');state.user=d;state.role=d?.role||null;state.screen=state.role==='admin'?'admin':'home';await loadCourses();if(state.role==='admin')await loadStats();return render()}catch(e){logout()}}render()}
function render(){const a=document.getElementById('app');if(state.screen==='login')a.innerHTML=login();else if(state.screen==='home')a.innerHTML=home();else if(state.screen==='subjects')a.innerHTML=subjects();else if(state.screen==='subjects2')a.innerHTML=subjects2();else if(state.screen==='study')a.innerHTML=study();else if(state.screen==='admin')a.innerHTML=admin()}
function login(){return `<div class=login><div class=loginbox><div class=brand>Exam<span>Prep</span> Pro</div><p class=muted>Smart exam preparation with cloud-ready backend</p><div class=field><label>Username</label><input id=email value="student" autocomplete=username></div><div class=field><label>Password</label><input type=password id=pass value="student123" autocomplete=current-password></div><button class="btn" style="width:100%" onclick="loginUser()">Login</button><p class=muted style="margin-top:14px">Student: <b>student / student123</b><br>Admin: <b>admin / admin123</b></p></div></div>`}
async function loginUser(){try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:document.getElementById('email').value,password:document.getElementById('pass').value})});state.token=d.token;state.user=d.user;state.role=d.user.role;localStorage.setItem('examprep_token',state.token);localStorage.setItem('examprep_user',JSON.stringify(state.user));await loadCourses();state.screen=state.role==='admin'?'admin':'home';if(state.role==='admin')await loadStats();render()}catch(e){alert(e.message)}}
async function loadCourses(){state.courses=(await api('/courses')).courses}
function home(){return `<div class=app><header class=top><div class=brand>Exam<span>Prep</span> Pro</div><div class=row><span class=pill>${esc(state.user?.name||'Student')}</span><button class="btn secondary" onclick="logout()">Logout</button></div></header><main class=wrap><section class=hero><h1>Prepare smarter. Score with confidence.</h1><p>Select your course and semester to access exam-focused materials.</p></section><h2>Choose your Course</h2><div class=grid>${state.courses.map((c,i)=>`<div class="card click" onclick="pickCourse('${c.id}')"><div class=icon>${i?'🎓':'💻'}</div><div class=title>${esc(c.name)}</div><div class=muted>${c.semesters.length} semesters available</div></div>`).join('')}</div></main></div>`}
function pickCourse(id){state.course=state.courses.find(c=>c.id===id);state.screen='subjects';render()}
function subjects(){return `<div class=app><header class=top><div class=brand>Exam<span>Prep</span> Pro</div><button class="btn secondary" onclick="goHome()">Home</button></header><main class=wrap><div class=back onclick="goHome()">← Back to courses</div><div class=crumb>${esc(state.course.name)}</div><h1>Select Semester</h1><div class=grid>${state.course.semesters.map(s=>`<div class="card click" onclick="pickSem('${s.id}')"><div class=icon>📘</div><div class=title>${esc(s.name)}</div><div class=muted>${s.subjects.length} subjects</div></div>`).join('')}</div></main></div>`}
function pickSem(id){state.sem=state.course.semesters.find(s=>s.id===id);state.screen='subjects2';render()}
function subjects2(){return `<div class=app><header class=top><div class=brand>Exam<span>Prep</span> Pro</div><button class="btn secondary" onclick="state.screen='subjects';render()">Back</button></header><main class=wrap><div class=crumb>${esc(state.course.name)} › ${esc(state.sem.name)}</div><h1>Select Subject</h1><div class=grid>${state.sem.subjects.map(s=>`<div class="card click" onclick="pickSubject('${s.id}')"><div class=icon>📚</div><div class=title>${esc(s.name)}</div><div class=muted>Questions • Notes • Videos</div></div>`).join('')}</div></main></div>`}
async function pickSubject(id){state.subject=state.sem.subjects.find(s=>s.id===id);state.screen='study';state.tab='questions';await loadContent();render()}
async function loadContent(){const type={questions:'question',notes:'note',videos:'video'}[state.tab];const d=await api(`/content?type=${type}&courseId=${state.course.id}&semesterId=${state.sem.id}&subjectId=${state.subject.id}`);state.items=d.content}
function study(){return `<div class=app><header class=top><div class=brand>Exam<span>Prep</span> Pro</div><button class="btn secondary" onclick="state.screen='subjects2';render()">Back</button></header><main class=wrap><div class=crumb>${esc(state.course.name)} › ${esc(state.sem.name)} › ${esc(state.subject.name)}</div><h1>${esc(state.subject.name)}</h1><div class=tabs>${[['questions','📚 Previous Questions'],['notes','📝 Sure-Shot Notes'],['videos','▶ Exam Videos']].map(x=>`<button class="tab ${state.tab===x[0]?'active':''}" onclick="changeTab('${x[0]}')">${x[1]}</button>`).join('')}</div><div class=list>${state.items.length?state.items.map(x=>`<div class=item><div><div class=title>${state.tab==='questions'?'📚':state.tab==='notes'?'📝':'▶️'} ${esc(x.title)}</div><div class=muted>${esc(x.body||x.year||x.url||'Exam-oriented material')}</div></div>${x.url?`<a class=btn target=_blank href="${esc(x.url)}">Open</a>`:`<button class=btn onclick="alert('${state.tab==='notes'?'Note content is shown above.':state.tab==='questions'?'Question content is shown above.':'Video URL is not configured.'}')">Open</button>`}</div>`).join(''):`<div class=empty>No published ${state.tab} available for this subject yet.</div>`}</div></main></div>`}
async function changeTab(t){state.tab=t;await loadContent();render()}
async function loadStats(){state.stats=await api('/admin/stats')}
function admin(){return `<div class=app><header class=top><div class=brand>Exam<span>Prep</span> Pro <span class=pill>Admin</span></div><button class="btn secondary" onclick="logout()">Logout</button></header><main class=wrap><div class=hero><h1>Admin Panel</h1><p>Manage academic content and publish it to students.</p></div><div class=adminnav>${[['dashboard','📊 Dashboard'],['questions','📚 Questions'],['notes','📝 Notes'],['videos','▶ Videos']].map(x=>`<button class="btn ${state.adminTab===x[0]?'':'secondary'}" onclick="adminTab('${x[0]}')">${x[1]}</button>`).join('')}</div>${adminContent()}</main></div>`}
function adminTab(t){state.adminTab=t;render()}
function adminContent(){if(state.adminTab==='dashboard'){let s=state.stats||{};return `<div class=grid><div class=card><div class=muted>Total Courses</div><div class=stat>${s.courses||0}</div></div><div class=card><div class=muted>Subjects</div><div class=stat>${s.subjects||0}</div></div><div class=card><div class=muted>Question Papers</div><div class=stat>${s.questions||0}</div></div><div class=card><div class=muted>Notes</div><div class=stat>${s.notes||0}</div></div><div class=card><div class=muted>Videos</div><div class=stat>${s.videos||0}</div></div></div>`}
const type={questions:'question',notes:'note',videos:'video'}[state.adminTab];return `<div class=card><div class=row style="justify-content:space-between"><div><h2 style="margin:0">Manage ${state.adminTab}</h2><p class=muted>Content is stored in the backend and appears in the student app after publishing.</p></div><button class=btn onclick="openModal('${type}')">＋ Add</button></div><div id=adminlist class=list style="margin-top:18px">Loading...</div></div>`}
async function loadAdminList(type){const d=await api('/content?type='+type);const list=document.getElementById('adminlist');if(!list)return;list.innerHTML=d.content.length?d.content.map(x=>`<div class=item><div><b>${esc(x.title)}</b><div class=muted>${esc(x.courseId)} / ${esc(x.semesterId)} / ${esc(x.subjectId)} ${x.year?' / '+esc(x.year):''}</div></div><div class=row><span class=badge>${esc(x.status||'published')}</span><button class="btn danger" onclick="deleteContent('${x.id}')">Delete</button></div></div>`).join(''):`<div class=empty>No content yet.</div>`}
async function deleteContent(id){if(!confirm('Delete this content?'))return;try{await api('/content/'+id,{method:'DELETE'});await loadStats();render();setTimeout(()=>loadAdminList({questions:'question',notes:'note',videos:'video'}[state.adminTab]),0)}catch(e){alert(e.message)}}
function openModal(type){const courseOpts=state.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class=modal id=modal><div class=modalbox><h2>Add ${type}</h2><div class=field><label>Course</label><select id=mcourse onchange="fillSemesters()">${courseOpts}</select></div><div class=field><label>Semester</label><select id=msem onchange="fillSubjects()"></select></div><div class=field><label>Subject</label><select id=msub></select></div><div class=field><label>Title</label><input id=mtitle placeholder="Content title"></div><div class=field><label>${type==='video'?'Video URL':'Content / answer / note'}</label>${type==='video'?'<input id=murl placeholder="https://youtube.com/...">':'<textarea id=mbody style="width:100%;min-height:100px;padding:12px;border:1px solid var(--border);border-radius:11px"></textarea>'}</div><div class=field><label>Year (optional)</label><input id=myear placeholder="2025"></div><div class=row style="justify-content:flex-end"><button class="btn secondary" onclick="document.getElementById('modal').remove()">Cancel</button><button class=btn onclick="saveContent('${type}')">Save & Publish</button></div></div></div>`);fillSemesters()}
function fillSemesters(){const c=state.courses.find(x=>x.id===document.getElementById('mcourse').value);document.getElementById('msem').innerHTML=c.semesters.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');fillSubjects()}
function fillSubjects(){const c=state.courses.find(x=>x.id===document.getElementById('mcourse').value);const s=c.semesters.find(x=>x.id===document.getElementById('msem').value);document.getElementById('msub').innerHTML=s.subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function saveContent(type){try{const b={type,courseId:document.getElementById('mcourse').value,semesterId:document.getElementById('msem').value,subjectId:document.getElementById('msub').value,title:document.getElementById('mtitle').value,status:'published',year:document.getElementById('myear').value};if(type==='video')b.url=document.getElementById('murl').value;else b.body=document.getElementById('mbody').value;if(!b.title)throw Error('Title is required');await api('/content',{method:'POST',body:JSON.stringify(b)});document.getElementById('modal').remove();await loadStats();render();setTimeout(()=>loadAdminList(type),0)}catch(e){alert(e.message)}}
function goHome(){state.screen='home';render()}function logout(){localStorage.removeItem('examprep_token');localStorage.removeItem('examprep_user');state={...state,screen:'login',token:null,user:null,role:null};render()}
const oldRender=render;render=oldRender;init().then(()=>{if(state.screen==='admin'&&state.adminTab!=='dashboard')setTimeout(()=>loadAdminList({questions:'question',notes:'note',videos:'video'}[state.adminTab]),0)});
</script></body></html>
