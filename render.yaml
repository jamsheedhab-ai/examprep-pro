services:
  - type: web
    name: examprep-pro
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: examprep-data
      mountPath: /var/data
      sizeGB: 10
